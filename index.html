<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FixMyTube</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#ececec;
}

.header{
  background:#ff2d2d;
  color:white;
  padding:18px;
  text-align:center;
  font-size:28px;
  font-weight:bold;
}

.tools{
  padding:20px;
}

.tools h2{
  text-align:center;
  background:linear-gradient(180deg,#ff3b3b,#444);
  color:#fff;
  padding:18px;
  border-radius:20px;
  margin-bottom:24px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.card{
  height:170px;
  border-radius:22px;
  text-decoration:none;
  color:#000;
  font-weight:700;
  background:linear-gradient(180deg,#ff3b3b,#f2d08a);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.15);
  font-size:18px;
}

.card span{
  text-align:center;
  line-height:1.2;
}
</style>
</head>

<body>

<div class="header">FixMyTube</div>

<section class="tools">
  <h2>AI Tools</h2>

  <div class="grid">
    <a href="#" class="card">
      🎬
      <span>AI Social Media Video Cloner</span>
    </a>

    <a href="#" class="card">
      📹
      <span>AI Youtube Video Cloner</span>
    </a>

    <a href="#" class="card">
      📁
      <span>AI Local Video Cloner</span>
    </a>

    <a href="#" class="card">
      🎤
      <span>AI Text To Speech</span>
    </a>
  </div>
</section>

</body>
</html>

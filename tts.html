<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Text To Speech</title>
  <style>
    body{
      font-family:Arial;
      background:#f2f2f2;
      padding:20px;
    }
    textarea{
      width:100%;
      height:180px;
      border-radius:12px;
      padding:15px;
      font-size:18px;
      border:1px solid #ccc;
    }
    button{
      width:100%;
      padding:16px;
      margin-top:15px;
      border:none;
      border-radius:12px;
      background:#ff2d2d;
      color:white;
      font-size:20px;
      font-weight:bold;
    }
  </style>
</head>
<body>

<h2>🎤 AI Text To Speech</h2>

<textarea id="text" placeholder="Yahan Hindi ya English text likho..."></textarea>

<button onclick="speak()">🔊 Speak</button>

<script>
function speak(){
  const text = document.getElementById('text').value;

  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'hi-IN';
  speech.rate = 1;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}
</script>

</body>
</html>
